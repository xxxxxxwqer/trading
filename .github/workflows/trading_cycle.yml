name: AI Trading Arena — Live 5-Min Watch & 30-Min Trading Session

on:
  # Recommended: zero-delay external cron (e.g., cron-job.org) calling repository_dispatch or workflow_dispatch
  # at US market open (14:30 UTC / 23:30 KST) and midday handoff (17:55 UTC / 02:55 KST), Mon–Fri.
  repository_dispatch:
    types: [start-session, run-cycle]

  # Backup native GitHub crons using off-peak odd minutes (plus pre-buffered slots in case of GitHub cron delays).
  # If a delayed trigger fires while the US market is closed, session-step exits cleanly in ~15 seconds.
  schedule:
    - cron: "07 14 * * 1-5"
    - cron: "37 14 * * 1-5"
    - cron: "17 17 * * 1-5"
    - cron: "07 21 * * 1-5"
    - cron: "17 06 * * 1-5"
    - cron: "17 10 * * 1-5"

  # Manual one-click execution from GitHub "Actions" tab -> "Run workflow"
  workflow_dispatch:
    inputs:
      mode:
        description: "'session' = continuous 5-min watch + 30-min trade loop (up to 3.5h until close); 'single' = 1 cycle only"
        required: false
        default: "session"
        type: choice
        options:
          - session
          - single
      force_open_check:
        description: "Set to 'true' to force a test cycle even when the US market is closed"
        required: false
        default: "false"

# Strictly prevent overlapping sessions: Session 2 queues neatly behind Session 1 without cancelling live writes.
concurrency:
  group: ai-trading-arena-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-trading-cycle:
    name: Live 5-Min Watch & 30-Min Virtual Trading Session
    runs-on: ubuntu-latest
    timeout-minutes: 230

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Bot Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Live Market Session Loop (5-Min Watch + 30-Min Full Cycles)
        env:
          PYTHONPATH: src
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_MODE: ${{ github.event.inputs.mode || (github.event.action == 'run-cycle' && 'single' || 'session') }}
          FORCE_OPEN_CHECK: ${{ github.event.inputs.force_open_check || 'false' }}
        run: |
          commit_and_push() {
            mkdir -p reports
            git add state/ docs/ reports/
            if ! git diff --staged --quiet; then
              TIMESTAMP_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
              git commit -m "chore(arena): live update state, dashboard & reports [${TIMESTAMP_UTC}]"
            fi
            # Check if there are any unpushed local commits (including from a previous transient push failure)
            AHEAD=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo "0")
            if [ "$AHEAD" -eq 0 ]; then
              echo "No unpushed state, dashboard, or report commits."
              return 0
            fi
            for attempt in 1 2 3; do
              if git pull --rebase origin main; then
                if git push origin HEAD:main; then
                  echo "Pushed ${AHEAD} live commit(s) on attempt ${attempt} ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))."
                  return 0
                fi
              else
                git rebase --abort 2>/dev/null || true
              fi
              SLEEP_SEC=$((attempt * 4))
              echo "Push attempt ${attempt} failed (transient GitHub error); retrying in ${SLEEP_SEC}s..."
              sleep "$SLEEP_SEC"
            done
            echo "WARNING: Failed to push after 3 attempts; unpushed commit(s) will retry automatically on next tick."
            return 1
          }

          if [ "$RUN_MODE" = "single" ] || [ "$FORCE_OPEN_CHECK" = "true" ]; then
            if [ "$FORCE_OPEN_CHECK" = "true" ]; then
              python -m arena.cli run-cycle --force-open-check
            else
              python -m arena.cli run-cycle
            fi
            commit_and_push
            exit 0
          fi

          # Continuous session mode: watches live quotes & SL/TP every 5 minutes for up to 210 minutes (3.5h).
          # Full 30-min trading cycles & any SL/TP triggers push immediately; quiet monitor ticks push every ~10 min
          # so GitHub Pages stays comfortably under its 10 deploys/hour soft limit.
          START_EPOCH=$(date +%s)
          LAST_PUSH_EPOCH=0
          MAX_SECONDS=12600  # 210 minutes (3.5 hours)
          TICK=0
          CONSECUTIVE_ERRORS=0

          while true; do
            TICK=$((TICK + 1))
            echo "=================================================================="
            echo "  LIVE SESSION TICK #${TICK} — $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "=================================================================="

            # Pull any external commits safely before stepping (autostash preserves quiet-tick local state)
            git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; }

            set +e
            python -m arena.cli session-step
            RC=$?
            set -e

            NOW_EPOCH=$(date +%s)
            SINCE_PUSH=$((NOW_EPOCH - LAST_PUSH_EPOCH))

            if [ "$RC" -eq 20 ]; then
              commit_and_push || true
              echo "Market is CLOSED (or 30-day competition COMPLETED). Session loop exiting cleanly."
              exit 0
            elif [ "$RC" -eq 0 ]; then
              CONSECUTIVE_ERRORS=0
              if commit_and_push; then
                LAST_PUSH_EPOCH=$(date +%s)
              fi
            elif [ "$RC" -eq 10 ]; then
              # Quiet 5-min watch tick (0 SL/TP triggers): push every >= 9 min to stay under GitHub Pages 10/hr cap
              CONSECUTIVE_ERRORS=0
              if [ "$SINCE_PUSH" -ge 540 ]; then
                if commit_and_push; then
                  LAST_PUSH_EPOCH=$(date +%s)
                fi
              else
                echo "Quiet 5-min SL/TP watch tick OK (0 triggers; next Pages push in $((540 - SINCE_PUSH))s)."
              fi
            else
              CONSECUTIVE_ERRORS=$((CONSECUTIVE_ERRORS + 1))
              echo "WARNING: session-step exited with code ${RC} (consecutive errors: ${CONSECUTIVE_ERRORS}/3)."
              commit_and_push || true
              if [ "$CONSECUTIVE_ERRORS" -ge 3 ]; then
                echo "Aborting session after 3 consecutive failures."
                exit "$RC"
              fi
            fi

            ELAPSED=$((NOW_EPOCH - START_EPOCH))
            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              commit_and_push || true
              echo "Reached 3.5-hour session window (${ELAPSED}s). Handing off cleanly to next session."
              exit 0
            fi

            echo "Sleeping 300 seconds (5 minutes) until next live watch tick..."
            sleep 300
          done
