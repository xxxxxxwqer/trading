name: AI Trading Arena — Live 5-Min Watch & 30-Min Trading Session

on:
  # Recommended: zero-delay external cron (e.g., cron-job.org) calling repository_dispatch or workflow_dispatch
  # at US market open (14:30 UTC / 23:30 KST) and midday handoff (17:55 UTC / 02:55 KST), Mon–Fri.
  repository_dispatch:
    types: [start-session, run-cycle]

  # Backup native GitHub crons using off-peak odd minutes (plus pre-buffered slots in case of GitHub cron delays).
  # If a delayed trigger fires while the US market is closed, session-step exits cleanly in ~15 seconds.
  schedule:
    - cron: "07 14 * * 1-5"
    - cron: "37 14 * * 1-5"
    - cron: "17 17 * * 1-5"
    - cron: "07 21 * * 1-5"
    - cron: "17 06 * * 1-5"
    - cron: "17 10 * * 1-5"

  # Manual one-click execution from GitHub "Actions" tab -> "Run workflow"
  workflow_dispatch:
    inputs:
      mode:
        description: "'session' = continuous 5-min watch + 30-min trade loop (up to 3.5h until close); 'single' = 1 cycle only"
        required: false
        default: "session"
        type: choice
        options:
          - session
          - single
      force_open_check:
        description: "Set to 'true' to force a test cycle even when the US market is closed"
        required: false
        default: "false"

# Strictly prevent overlapping sessions: Session 2 queues neatly behind Session 1 without cancelling live writes.
concurrency:
  group: ai-trading-arena-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-trading-cycle:
    name: Live 5-Min Watch & 30-Min Virtual Trading Session
    runs-on: ubuntu-latest
    timeout-minutes: 230

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Bot Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Live Market Session Loop (5-Min Watch + 30-Min Full Cycles)
        env:
          PYTHONPATH: src
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_MODE: ${{ github.event.inputs.mode || (github.event.action == 'run-cycle' && 'single' || 'session') }}
          FORCE_OPEN_CHECK: ${{ github.event.inputs.force_open_check || 'false' }}
        run: |
          commit_and_push() {
            mkdir -p reports
            git add state/ docs/ reports/
            if git diff --staged --quiet; then
              echo "No state, dashboard, or report changes to commit."
              return 0
            fi
            TIMESTAMP_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore(arena): live update state, dashboard & reports [${TIMESTAMP_UTC}]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main; then
                if git push origin HEAD:main; then
                  echo "Pushed live update on attempt ${attempt} (${TIMESTAMP_UTC})."
                  return 0
                fi
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "Push attempt ${attempt} failed; retrying in 3s..."
              sleep 3
            done
            echo "Failed to push after 3 attempts."
            return 1
          }

          if [ "$RUN_MODE" = "single" ] || [ "$FORCE_OPEN_CHECK" = "true" ]; then
            if [ "$FORCE_OPEN_CHECK" = "true" ]; then
              python -m arena.cli run-cycle --force-open-check
            else
              python -m arena.cli run-cycle
            fi
            commit_and_push
            exit 0
          fi

          # Continuous session mode: runs every 5 minutes for up to 210 minutes (3.5h) while US market is open.
          # Two overlapping sessions (open 14:30 UTC + midday 17:55 UTC) cover the entire 6.5h trading day seamlessly.
          START_EPOCH=$(date +%s)
          MAX_SECONDS=12600  # 210 minutes (3.5 hours)
          TICK=0

          while true; do
            TICK=$((TICK + 1))
            echo "=================================================================="
            echo "  LIVE SESSION TICK #${TICK} — $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "=================================================================="

            # Pull any external commits safely before stepping
            git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }

            set +e
            python -m arena.cli session-step
            RC=$?
            set -e

            commit_and_push

            if [ "$RC" -eq 20 ]; then
              echo "Market is CLOSED (or 30-day competition COMPLETED). Session loop exiting cleanly."
              exit 0
            elif [ "$RC" -ne 0 ]; then
              echo "session-step failed with exit code ${RC}."
              exit "$RC"
            fi

            NOW_EPOCH=$(date +%s)
            ELAPSED=$((NOW_EPOCH - START_EPOCH))
            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              echo "Reached 3.5-hour session window (${ELAPSED}s). Handing off cleanly to next session."
              exit 0
            fi

            echo "Sleeping 300 seconds (5 minutes) until next live watch tick..."
            sleep 300
          done
